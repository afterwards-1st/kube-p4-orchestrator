# Worker 指标接收器：只处理遥测上报，不参与 P4 转发或写表。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-receiver
  namespace: kube-orchestrator
  labels:
    app.kubernetes.io/name: metrics-receiver
    app.kubernetes.io/part-of: kube-orchestrator
spec:
  replicas: 1
  # 指标暂存在内存中；Recreate 可避免滚动升级期间两个实例各收一部分报文。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-receiver
        app.kubernetes.io/part-of: kube-orchestrator
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: node194
      containers:
        - name: metrics-receiver
          image: kube-orchestrator:0.3.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.metrics_receiver"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: WORKER_SLOTS
              value: "216,217,218,226,227,228"
            - name: METRICS_STALE_AFTER_SECONDS
              value: "3"
            - name: METRICS_UDP_PORT
              value: "9999"
            - name: METRICS_HTTP_PORT
              value: "8080"
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metrics-receiver-auth
                  key: token
          ports:
            - name: reports
              containerPort: 9999
              protocol: UDP
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-receiver
  namespace: kube-orchestrator
  labels:
    app.kubernetes.io/name: metrics-receiver
    app.kubernetes.io/part-of: kube-orchestrator
spec:
  selector:
    app.kubernetes.io/name: metrics-receiver
  ports:
    - name: reports
      port: 9999
      targetPort: reports
      protocol: UDP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
