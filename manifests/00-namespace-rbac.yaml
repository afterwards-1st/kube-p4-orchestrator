apiVersion: v1
kind: Namespace
metadata:
  name: kube-orchestrator
  labels:
    app.kubernetes.io/part-of: kube-orchestrator
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: controller-quota
  namespace: kube-orchestrator
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: kube-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-orchestrator-observer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-orchestrator-observer
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: kube-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-orchestrator-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-orchestrator-controller
  namespace: kube-orchestrator
rules:
  - apiGroups: ["orchestrator.wzt.io"]
    resources: ["computetasks", "computetasks/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-orchestrator-controller
  namespace: kube-orchestrator
subjects:
  - kind: ServiceAccount
    name: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-orchestrator-controller
