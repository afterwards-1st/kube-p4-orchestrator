apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: computetasks.orchestrator.wzt.io
spec:
  group: orchestrator.wzt.io
  scope: Namespaced
  names:
    plural: computetasks
    singular: computetask
    kind: ComputeTask
    shortNames: [ctask]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, resources]
              properties:
                image:
                  type: string
                command:
                  type: array
                  items:
                    type: string
                execution:
                  type: string
                  enum: [plan, apply]
                  default: plan
                strategy:
                  type: string
                  enum: [nodeScore, minExpectedCompletionTime]
                  default: nodeScore
                taskCount:
                  type: integer
                  format: int64
                  minimum: 0
                  default: 0
                maxWorkers:
                  type: integer
                  minimum: 0
                  default: 0
                resources:
                  type: object
                  required: [cpu, memory]
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: integer
                      minimum: 0
                preferredNodeLabels:
                  type: object
                  additionalProperties:
                    type: string
                workerSelector:
                  type: object
                  additionalProperties:
                    type: string
                network:
                  type: object
                  properties:
                    minBandwidthMbps:
                      type: number
                      minimum: 0
                    maxLatencyMs:
                      type: number
                      minimum: 0
                routing:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [plan, apply]
                      default: plan
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                executionAllowed:
                  type: boolean
                phase:
                  type: string
                selectedNode:
                  type: string
                score:
                  type: number
                decision:
                  type: string
                jobName:
                  type: string
                candidateEvidence:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                selectedWorkers:
                  type: array
                  items:
                    type: object
                    required: [pod, namespace, node, assignedTaskCount]
                    properties:
                      pod:
                        type: string
                      namespace:
                        type: string
                      node:
                        type: string
                      flowId:
                        type: integer
                        minimum: 1
                        maximum: 255
                      backendId:
                        type: integer
                        minimum: 1
                      assignedTaskCount:
                        type: integer
                        format: int64
                        minimum: 0
                      estimatedFinishMs:
                        type: number
                      allocatedResources:
                        type: object
                        additionalProperties:
                          type: number
                estimatedMakespanMs:
                  type: number
                estimatedTotalMs:
                  type: number
                evaluatedCombinations:
                  type: integer
                  format: int64
                  minimum: 0
                routing:
                  type: object
                  properties:
                    phase:
                      type: string
                    writeAllowed:
                      type: boolean
                    routeOwner:
                      type: string
                    desiredRoutes:
                      type: array
                      items:
                        type: object
                        required: [flowId, backendId]
                        properties:
                          flowId:
                            type: integer
                            minimum: 1
                            maximum: 255
                          backendId:
                            type: integer
                            minimum: 1
                    observedRoutes:
                      type: array
                      items:
                        type: object
                        required: [flowId, backendId]
                        properties:
                          flowId:
                            type: integer
                            minimum: 1
                            maximum: 255
                          backendId:
                            type: integer
                            minimum: 1
                    inSync:
                      type: boolean
                    applied:
                      type: boolean
                    controlOwner:
                      type: string
                    controlMode:
                      type: string
                    dryRun:
                      type: boolean
                    error:
                      type: string
                decisionTrace:
                  type: object
                  required:
                    - reason
                    - recordedAt
                    - metricsSource
                    - metricsFreshness
                    - dynamicBackendCount
                  properties:
                    reason:
                      type: string
                      enum:
                        - initial-plan
                        - observability-initialized
                        - phase-changed
                        - selected-workers-changed
                        - selected-node-changed
                        - metrics-state-changed
                        - estimated-completion-changed
                        - plan-details-changed
                    recordedAt:
                      type: string
                      format: date-time
                    metricsSource:
                      type: string
                    metricsFreshness:
                      type: string
                      enum:
                        - fresh
                        - stale
                        - unavailable
                        - static
                        - not-applicable
                    dynamicBackendCount:
                      type: integer
                      minimum: 0
                    queueDepthByBackend:
                      type: object
                      additionalProperties:
                        type: number
                        minimum: 0
