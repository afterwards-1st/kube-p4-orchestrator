{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-orchestrator.fullname" . }}-runtime-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
data:
  runtime_metrics.json: |
    {{- .Values.runtimeMetrics.config | nindent 4 }}
{{- end }}
---
{{- if or .Values.metricsReceiver.auth.create .Values.metricsReceiver.auth.existingSecret }}
{{- if not .Values.metricsReceiver.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: metrics-receiver-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.metricsReceiver.auth.token | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: p4-control-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.p4ControlToken | quote }}
