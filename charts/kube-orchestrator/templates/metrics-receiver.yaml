{{- if .Values.metricsReceiver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-orchestrator.metricsReceiverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metrics-receiver
    app.kubernetes.io/component: metrics-receiver
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: 1
  # 指标暂存在内存中；Recreate 可避免滚动升级期间两个实例各收一部分报文
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-receiver
      app.kubernetes.io/component: metrics-receiver
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-receiver
        app.kubernetes.io/component: metrics-receiver
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "kube-orchestrator.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: metrics-receiver
          image: {{ include "kube-orchestrator.image" (dict "image" .Values.metricsReceiver.image) }}
          imagePullPolicy: {{ .Values.metricsReceiver.image.pullPolicy }}
          command: ["python", "-m", "app.metrics_receiver"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: WORKER_SLOTS
              value: {{ .Values.metricsReceiver.workerSlots | quote }}
            - name: METRICS_STALE_AFTER_SECONDS
              value: {{ .Values.metricsReceiver.staleAfterSeconds | quote }}
            - name: METRICS_UDP_PORT
              value: {{ .Values.metricsReceiver.udpPort | quote }}
            - name: METRICS_HTTP_PORT
              value: {{ .Values.metricsReceiver.httpPort | quote }}
            {{- if or .Values.metricsReceiver.auth.create .Values.metricsReceiver.auth.existingSecret }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default "metrics-receiver-auth" .Values.metricsReceiver.auth.existingSecret }}
                  key: {{ default "token" .Values.metricsReceiver.auth.existingSecretKey }}
            {{- end }}
          ports:
            - name: reports
              containerPort: {{ .Values.metricsReceiver.udpPort }}
              protocol: UDP
            - name: http
              containerPort: {{ .Values.metricsReceiver.httpPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.metricsReceiver.resources | nindent 12 }}
          securityContext:
            {{- include "kube-orchestrator.securityContext" . | nindent 12 }}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-orchestrator.metricsReceiverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metrics-receiver
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metricsReceiver.serviceType }}
  selector:
    app.kubernetes.io/name: metrics-receiver
    app.kubernetes.io/component: metrics-receiver
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: reports
      port: {{ .Values.metricsReceiver.udpPort }}
      targetPort: reports
      protocol: UDP
    - name: http
      port: {{ .Values.metricsReceiver.httpPort }}
      targetPort: http
      protocol: TCP
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kube-orchestrator.metricsReceiverName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metrics-receiver
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-receiver
      app.kubernetes.io/component: metrics-receiver
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if or .Values.metricsReceiver.auth.create .Values.metricsReceiver.auth.existingSecret }}
      authorization:
        type: Bearer
        credentials:
          name: {{ default "metrics-receiver-auth" .Values.metricsReceiver.auth.existingSecret }}
          key: {{ default "token" .Values.metricsReceiver.auth.existingSecretKey }}
      {{- end }}
{{- end }}
{{- end }}
