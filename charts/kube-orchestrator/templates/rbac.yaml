{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-orchestrator.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-orchestrator.fullname" . }}-observer
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-orchestrator.fullname" . }}-observer
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-orchestrator.controllerName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-orchestrator.fullname" . }}-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-orchestrator.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["orchestrator.wzt.io"]
    resources: ["computetasks", "computetasks/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-orchestrator.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-orchestrator.controllerName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-orchestrator.controllerName" . }}
{{- if .Values.resourceQuota.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "kube-orchestrator.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-orchestrator.labels" . | nindent 4 }}
spec:
  hard:
    {{- range $key, $value := .Values.resourceQuota.hard }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
{{- end }}
{{- end }}
